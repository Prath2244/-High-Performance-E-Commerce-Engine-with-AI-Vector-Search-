version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: ecom-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ecom
    networks:
      - ecom-network

  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ecom-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ecom-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/ecom
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-this}
      CACHE_TTL: 3600
    depends_on:
      - mongodb
      - redis
    networks:
      - ecom-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ecom-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"  # If using HTTPS
    depends_on:
      - backend
    networks:
      - ecom-network

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local

networks:
  ecom-network:
    driver: bridge